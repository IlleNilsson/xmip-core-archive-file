[package]
name = "xmip-core-archive-file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-archive-file"
description = "File archive target: one item is one file under a directory, its TOML metadata in a tree beside it, each created whole and never written over. A xmip-core-archive technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The ArchiveStore trait and its types live there,
# and so do the sidecar, the rule of a name-keyed store, the file created
# whole and the `file://` receipt of a directory (ADR-0044).
archive = { workspace = true }

[dev-dependencies]
# The wait for a directory's sweep (`archive::whole::swept`), under the
# capability's `test-support`, so it is never part of a production build.
archive = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`), and a file held as
# another archive's write holds it (`file::held`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
